services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - chat-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  nestjs:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-claude-haiku-4-5-20251001}
      REDIS_URL: redis://redis:6379
      SESSION_STORE: ${SESSION_STORE:-redis}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3001/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - chat-net

  nextjs:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      API_URL: http://nestjs:3001
    depends_on:
      nestjs:
        condition: service_healthy
    networks:
      - chat-net

networks:
  chat-net:
    driver: bridge
